<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Mental Health Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg p-4">

        <h2 class="text-center mb-4">
            Student Mental Health Prediction System
        </h2>

        <form action="/predict" method="POST">

            <div class="mb-3">
                <label class="form-label">Gender</label>

                <select class="form-select" name="gender" required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">GHQ Score</label>
                <input type="number" class="form-control" name="ghq" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Depression Score</label>
                <input type="number" class="form-control" name="depression" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Anxiety Score</label>
                <input type="number" class="form-control" name="anxiety" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Stress Score</label>
                <input type="number" class="form-control" name="stress" required>
            </div>

            <div class="mb-3">
                <label class="form-label">BRS Score</label>
                <input type="number" step="0.01" class="form-control" name="brs" required>
            </div>

            <div class="d-grid">
                <button class="btn btn-primary btn-lg" type="submit">
                    Predict
                </button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
